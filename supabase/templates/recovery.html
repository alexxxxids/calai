<h2>Resetowanie hasła w CalAI</h2>

<p>Otrzymaliśmy prośbę o zresetowanie hasła do Twojego konta.</p>

<p>Twój kod do zmiany hasła to:</p>

<p style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">{{ .Token }}</p>

<p>Wpisz ten kod na stronie resetowania hasła wraz z nowym hasłem.</p>

<p>Jeśli nie prosiłeś o reset hasła, zignoruj tę wiadomość — Twoje obecne hasło pozostanie niezmienione.</p>
